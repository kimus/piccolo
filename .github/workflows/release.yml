name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release archives
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            work="$(mktemp -d)"
            stamp="-s -w -X main.version=${GITHUB_REF_NAME} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "$stamp" -o "$work/piccolo" ./cmd/piccolo
            cp README.md "$work/README.md"
            tar -C "$work" -czf "dist/piccolo_${version}_${os}_${arch}.tar.gz" .
            rm -rf "$work"
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
          cat dist/checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
